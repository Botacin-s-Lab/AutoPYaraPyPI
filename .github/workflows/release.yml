name: Release

# Fires on every push to main; the `gate` job below decides whether the head
# commit's SUBJECT line asked for a release, and which kind:
#   "New subversion" -> patch bump   (0.1.5 -> 0.1.6)
#   "New version"     -> minor bump  (0.1.5 -> 0.2.0)
# Everything downstream is skipped if neither phrase is present.
on:
  push:
    branches: [main]

# Needed so the release job can push the version-bump commit + tag and
# create a GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      bump_type: ${{ steps.check.outputs.bump_type }}
    steps:
      - name: Check commit subject for a release trigger
        id: check
        env:
          # Passed via env, not interpolated into the script body: a crafted
          # commit message must not be able to inject shell commands here.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Only the SUBJECT line (first line) is checked, not the full
          # message body. A body/changelog describing this workflow will
          # almost inevitably mention these trigger phrases in prose (e.g.
          # "the gate checks for 'New version' in the commit message") --
          # matching against the whole message caused exactly that
          # self-referential false trigger once already.
          #
          # "new subversion" is checked first: it contains "version" as a
          # substring but NOT the substring "new version" (there's no space
          # before "version" in "subversion"), so the two are mutually
          # exclusive and order doesn't actually matter here -- but checking
          # the more specific phrase first keeps that guarantee obvious.
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr '[:upper:]' '[:lower:]')
          if [[ "$SUBJECT" == *"new subversion"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
            echo "Commit subject contains 'New subversion' -> patch release."
          elif [[ "$SUBJECT" == *"new version"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
            echo "Commit subject contains 'New version' -> minor release."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump_type=" >> "$GITHUB_OUTPUT"
            echo "No release trigger phrase in commit subject -> skipping release."
          fi

  test:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    uses: ./.github/workflows/build-and-test.yml

  release:
    needs: [gate, test]
    runs-on: ubuntu-latest
    steps:
      # Authenticates as RELEASE_PAT (a fine-grained PAT held by a repo
      # admin), not the default GITHUB_TOKEN. main requires PRs from
      # everyone except the "Repository admin" bypass entry in its
      # ruleset -- the default GITHUB_TOKEN's push identity doesn't hold
      # that role, so it would be rejected. See RELEASING.md.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version in setup.py
        id: bump
        run: echo "version=$(python .github/scripts/bump_version.py ${{ needs.gate.outputs.bump_type }})" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py
          git commit -m "Release v${{ steps.bump.outputs.version }} [automated]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist

      - name: twine check
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" dist/* \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
