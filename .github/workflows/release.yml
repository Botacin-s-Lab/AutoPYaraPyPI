name: Release

# Fires on every push to main; the `gate` job below decides whether the head
# commit actually asked for a release (message contains "New version",
# case-insensitively). Everything downstream is skipped otherwise.
on:
  push:
    branches: [main]

# Needed so the release job can push the version-bump commit + tag and
# create a GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_REPO: Botacin-s-Lab/AutoPYaraPyPI
  DATA_BRANCH: data-branch

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check commit message for the "New version" trigger
        id: check
        env:
          # Passed via env, not interpolated into the script body: a crafted
          # commit message must not be able to inject shell commands here.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')
          if [[ "$MSG" == *"new version"* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Commit message contains 'New version' -> will release."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Commit message does not contain 'New version' -> skipping release."
          fi

  test:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # AutoPYara's backend is a JVM (see autopyara/jars/AutoYara.jar). Java
      # isn't required to build or pip-install the package (see setup.py),
      # but it IS required to actually run generate() — which is exactly
      # what tests/test_smoke_generate.py does below, as the real pre-release
      # functional check.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve site-packages path (for the bloom-data cache key/path)
        id: sitepkg
        run: echo "path=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" >> "$GITHUB_OUTPUT"

      - name: Resolve data-branch commit sha (cache key)
        id: databranch
        run: echo "sha=$(git ls-remote https://github.com/${DATA_REPO}.git ${DATA_BRANCH} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Install the built wheel + test extras
        # Installs from the wheel: this is what a real `pip install autopyara`
        # will fetch from PyPI, so this is the path we actually want verified.
        run: python -m pip install "$(ls dist/*.whl)[test]"

      # Restore the ~500-600MB bloom filter data from a prior run instead of
      # re-downloading it every time; only refetched when data-branch moves.
      - name: Cache bloom filter data
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.sitepkg.outputs.path }}/autopyara/data
          key: autopyara-bloom-data-${{ steps.databranch.outputs.sha }}

      - name: Download bloom filter data (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: autopyara-download

      - name: Smoke-import
        run: python -c "from autopyara import AutoPYara; print('import OK')"

      - name: Run test suite
        run: python -m pytest tests/ -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump patch version in setup.py
        id: bump
        run: echo "version=$(python .github/scripts/bump_version.py)" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py
          git commit -m "Release v${{ steps.bump.outputs.version }} [automated]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist

      - name: twine check
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" dist/* \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
