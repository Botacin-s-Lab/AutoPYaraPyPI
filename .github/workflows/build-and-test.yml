name: Build & Test

# Reusable workflow: builds the sdist+wheel, installs the wheel (the same
# artifact a real `pip install autopyara` would fetch), and runs the full
# test suite across the supported Python matrix. Used by both:
#   - release.yml's `test` job (the pre-publish gate)
#   - pr-checks.yml (tests incoming PRs, no publish step)
# Keep these two callers' behavior identical by editing only this file.
on:
  workflow_call:

env:
  DATA_REPO: Botacin-s-Lab/AutoPYaraPyPI
  DATA_BRANCH: data-branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is intentionally excluded: yara-python, yaramod, and
        # scikit-learn's current releases no longer publish cp38 wheels
        # (3.8 reached EOL in Oct 2024) -- confirmed against PyPI, not a
        # guess. See setup.py's python_requires.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # AutoPYara's backend is a JVM (see autopyara/jars/AutoYara.jar). Java
      # isn't required to build or pip-install the package (see setup.py),
      # but it IS required to actually run generate() — which is exactly
      # what tests/test_smoke_generate.py does below, as the real functional
      # check.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve site-packages path (for the bloom-data cache key/path)
        id: sitepkg
        run: echo "path=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" >> "$GITHUB_OUTPUT"

      - name: Resolve data-branch commit sha (cache key)
        id: databranch
        run: echo "sha=$(git ls-remote https://github.com/${DATA_REPO}.git ${DATA_BRANCH} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Install the built wheel + test extras
        # Installs from the wheel: this is what a real `pip install autopyara`
        # will fetch from PyPI, so this is the path we actually want verified.
        run: python -m pip install "$(ls dist/*.whl)[test]"

      # Restore the ~500-600MB bloom filter data from a prior run instead of
      # re-downloading it every time; only refetched when data-branch moves.
      - name: Cache bloom filter data
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.sitepkg.outputs.path }}/autopyara/data
          key: autopyara-bloom-data-${{ steps.databranch.outputs.sha }}

      - name: Download bloom filter data (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: autopyara-download

      - name: Smoke-import
        run: python -c "from autopyara import AutoPYara; print('import OK')"

      - name: Run test suite
        run: python -m pytest tests/ -v
