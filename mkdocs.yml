site_name: AutoPYara
site_description: Automated, Cluster-Driven YARA Rule Generation
site_url: https://botacin-s-lab.github.io/AutoPYaraPyPI/
repo_name: Botacin-s-Lab/AutoPYaraPyPI
repo_url: https://github.com/Botacin-s-Lab/AutoPYaraPyPI
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Development & Releasing: development.md

theme:
  name: material
  icon:
    logo: material/radar
    repo: fontawesome/brands/github
  favicon: images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: >
  Maintained by Mabon Ninan, Texas A&amp;M University —
  <a href="mailto:ninanmm@tamu.edu">ninanmm@tamu.edu</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Botacin-s-Lab/AutoPYaraPyPI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/autopyara/
