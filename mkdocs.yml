site_name: AutoPYara
site_description: Automated, Cluster-Driven YARA Rule Generation
site_url: https://botacin-s-lab.github.io/AutoPYaraPyPI/
repo_name: Botacin-s-Lab/AutoPYaraPyPI
repo_url: https://github.com/Botacin-s-Lab/AutoPYaraPyPI
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - API Reference: api.md
  - Development & Releasing: development.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Botacin-s-Lab/AutoPYaraPyPI
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/autopyara/
